name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk-signe:
    name: Build APK & AAB signés, Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valider l'intégrité du wrapper Gradle
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build APK et AAB release signés
        env:
          TAG_VERSION: ${{ github.ref_name }}
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      # L'AAB (non installable tel quel) et le mapping R8 sont destinés à la Play
      # Console : artefact du run plutôt que fichier public de la Release.
      - name: Conserver l'AAB pour Google Play
        uses: actions/upload-artifact@v4
        with:
          name: CallController-${{ github.ref_name }}-play
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publier la Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --generate-notes
